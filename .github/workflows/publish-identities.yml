name: Pubblica identità grafiche

on:
  push:
    branches: [main]
    paths: ['config/identities.json', 'public/symbols/**', 'scripts/identities.py', 'scripts/publish_identities.py', 'requirements.txt', '.github/workflows/publish-identities.yml']
  workflow_dispatch:

concurrency:
  group: electo-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  identities:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepara conversione simboli
        run: python -m pip install -r requirements.txt
      - name: Verifica registro e pubblicazione
        run: python -m unittest discover -s tests -v
      - name: Pubblica identità sugli ultimi risultati verificati
        run: python scripts/publish_identities.py
      - name: Salva registro e collegamenti verificati
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/
          if ! git diff --cached --quiet; then
            git commit -m 'Aggiorna identità e collegamenti sui risultati verificati'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: identities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Pubblica registro su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
