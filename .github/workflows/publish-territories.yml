name: Pubblica dettagli territoriali

on:
  push:
    branches: [main]
    paths: ['scripts/territory_tree.py', 'scripts/publish_territories.py', 'tests/test_territory_tree.py', 'sources.json', '.github/workflows/publish-territories.yml']
  workflow_dispatch:
  schedule:
    - cron: '57 4 * * *'

concurrency:
  group: electo-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepara conversione simboli SVG
        run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache
          key: eligendo-v1-${{ github.run_id }}
          restore-keys: eligendo-v1-
      - name: Verifica convertitore
        run: python -m unittest discover -s tests -v
      - name: Verifica e pubblica i dettagli territoriali
        run: python scripts/publish_territories.py
      - name: Salva soltanto JSON pubblici verificati
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/v1/territories/
          if ! git diff --cached --quiet; then
            git commit -m 'Pubblica navigazione territoriale da file ministeriali verificati'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Pubblica JSON su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
