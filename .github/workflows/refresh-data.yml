name: Aggiorna dati Eligendo

on:
  push:
    branches: [main]
    paths: ['scripts/**', 'requirements.txt', 'sources.json', 'tests/**', 'config/**', 'public/symbols/**', '.github/workflows/**']
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * *'

concurrency:
  group: electo-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepara conversione simboli SVG
        run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache
          key: eligendo-v1-${{ github.run_id }}
          restore-keys: eligendo-v1-
      - name: Verifica convertitore
        run: python -m unittest discover -s tests -v
      - name: Recupera e verifica tutte le fonti
        run: python scripts/sync.py
      - name: Salva soltanto JSON pubblici verificati
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/
          if ! git diff --cached --quiet; then
            git commit -m 'Aggiorna archivio da fonti Eligendo verificate'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Pubblica JSON su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
