name: Recupero manuale · Pubblica ricerca territoriale

# Percorso di recupero manuale; la pubblicazione automatica è in publish-data.yml.
on:
  workflow_dispatch:

concurrency:
  group: electo-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepara verifiche
        run: python -m pip install -r requirements.txt
      - name: Verifica pubblicazione
        run: python -m unittest discover -s tests -v
      - name: Indicizza i territori già verificati
        run: python scripts/publish_territory_search.py
      - name: Salva ricerca territoriale verificata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/v1/territories/
          if ! git diff --cached --quiet; then
            git commit -m 'Aggiorna indice globale dei territori'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: search
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Pubblica ricerca su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
